{% extends 'base.html' %}

{% block title %}Schema Man{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/normalizator.css') }}">
{% endblock %}

{% block body %}

<section class="normalizator-container">
	<div class="container" id="sql-container">
		<div class="sql-buttons">

			<button class="button-for-sql" id="sql-engine-selector">
				Select the engine
				<i class="fa-solid fa-database"></i>
			</button>
			<button class="button-for-sql" id="sql-normalization-selector">
				Normalization level
				<i class="fa-regular fa-file-code"></i>
			</button>
		</div>

		<textarea class="sql-editor"> 
		</textarea>
	</div>

	<div class="container" id="report-container">
		<div class="report-buttons">
			<button class="button-for-report" id="reporter-run">
				Run
				<i class="fa-solid fa-play"></i>
			</button>
			<button class="button-for-report" id="reporter-download">
				Download
				<i class="fa-solid fa-download"></i>
			</button>
		</div>
		<div class="report-page"></div>
	</div>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/codeEditor.js') }}"></script>
{% endblock %}
