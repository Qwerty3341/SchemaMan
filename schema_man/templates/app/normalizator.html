{% extends 'base.html' %}

{% block title %}Schema Man{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/normalizator.css') }}">
{% endblock %}

{% block content %}

<section class="normalizator-container">
	<div class="container" id="sql-container">
		<div class="sql-selects">
			<div class="selector-container">
				<label for="sql-engine-selector" class="select-label">
					<i class="fa-solid fa-database"></i> Engine:
				</label>
				<select class="select-for-sql" id="sql-engine-selector">
					<option value="sqlite">SQLite</option>
					<option value="mysql">MariaDB</option>
					<!-- <option value="postgres">PostgreSQL</option> -->
				</select>
			</div>

			<div class="selector-container">
				<label for="sql-normalization-selector" class="select-label">
					<i class="fa-regular fa-file-code"></i> Normalization level:
				</label>
				<select class="select-for-sql" id="sql-normalization-selector">
					<option>FN1</option>
					<option>FN2</option>
					<option>FN3</option>
					<option>BCNF</option>
					<option>FN4</option>
					<option>FN5</option>
				</select>
			</div>
		</div>

		<div id="sql-editor"></div>
	</div>

	<div class="container" id="report-container">
		<button type="button" class="button-for-report" id="reporter-run">
			Run
			<i class="fa-solid fa-play" aria-hidden="true"></i>
		</button>
	</div>

</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/codeEditor.bundle.js') }}"></script>
{% endblock %}
