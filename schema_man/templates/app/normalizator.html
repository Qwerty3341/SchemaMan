{% extends 'base.html' %}

{% block title %}Schema Man{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/normalizator.css') }}">
{% endblock %}

{% block content %}

<section class="normalizator-container">
	<div class="container" id="sql-container">
		<div class="sql-selects">
			<div class="selector-container">
				<label for="sql-engine-selector" class="select-label">
					<i class="fa-solid fa-database"></i>
					<span class="select-label-text">Engine:</span>
				</label>
				<select class="select-for-sql" id="sql-engine-selector">
					<option value="sqlite">SQLite</option>
					<option value="mysql">MariaDB</option>
					<!-- <option value="postgres">PostgreSQL</option> -->
				</select>
			</div>

			<div class="selector-container">
				<label for="sql-normalization-selector" class="select-label">
					<span class="select-label-text">Norm. Level</span>
					<i class="fa-solid fa-shapes"></i>
				</label>
				<select class="select-for-sql" id="sql-normalization-selector">
					<option>NF1</option>
					<option>NF2</option>
					<option>NF3</option>
					<option>BCNF</option>
					<option>NF4</option>
					<option>NF5</option>
				</select>
			</div>

			<div class="selector-container" id="file-chooser-container">
				<button id="load-sql-label">
					<i class="fa-solid fa-code"></i>
					Load SQL
				</button>
				<input id="file-chooser" lang="en" type="file" accept=".sql,.txt,text/plain,application/sql" />
				<div id="file-name-container">
					<span id="file-name-span"></span>
				</div>
			</div>
		</div>

		<!--CodeMirror-->
		<div id="sql-editor"></div>
	</div>

	<div class="container" id="report-container">
		<button type="button" class="button-for-report" id="run-btn">
			Run
			<i class="fa-solid fa-play" aria-hidden="true"></i>
		</button>
		<div id="report-terminal">
			HOLA_MUNDO
		</div>
	</div>

</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/codeEditor.bundle.js') }}"></script>
<script src="{{ url_for('static', filename='js/loadReports.js') }}"></script>
<script src="{{ url_for('static', filename='js/run.js') }}"></script>
<script src="{{ url_for('static', filename='js/loadFile.js') }}"></script>
{% endblock %}
