{% extends 'base.html' %}

{% block title %}Schema Man{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/normalizator.css') }}">
{% endblock %}

{% block body %}

<section class="normalizator-container">
	<div class="container" id="sql-container">
		<div class="sql-buttons">
			<button class="button-for-sql" id="sql-engine-selector">Select the engine</button>
			<button class="button-for-sql" id="sql-normalization-selector">Normalization level</button>
		</div>

		<textarea class="text-editor"></textarea>
	</div>

	<div class="container" id="report-container">
		<div class="report-buttons">
			<button class="button-for-report" id="reporter-run">Run</button>
			<button class="button-for-report" id="reporter-download">Download</button>
		</div>
		<div class="report-page"></div>
	</div>
</section>

{% endblock %}

{% block scripts %}
{% endblock %}
