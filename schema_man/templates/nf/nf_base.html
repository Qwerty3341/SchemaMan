{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/nf.css') }}">
{% endblock %}

{% block content %}
<section class="nf-container">
	<h1>{% block nf_title %}{% endblock %}</h1>
	<h2>{% block nf_subtitle %}{% endblock %}</h2>

	<div class="nf-description">
		{% block nf_description %}{% endblock %}
	</div>

	<div class="nf-example">
		<h3>Example</h3>
		{% block nf_example %}{% endblock %}
	</div>
</section>

{% endblock %}
