{% extends 'base.html' %}

{% block title %}Schema Man{% endblock %}

{% block styles %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/gruvbox-dark.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/normalizator.css') }}">
{% endblock %}

{% block body %}

<section class="normalizator-container">
	<div class="container" id="sql-container">
		<div class="sql-selects">
			<div class="selector-container">
				<label for="sql-engine-selector" class="select-label">
					<i class="fa-solid fa-database"></i> Engine: 
				</label>
				<select class="select-for-sql" id="sql-engine-selector">
					<option>SQlite</option>
					<option>MariaDB</option>
					<option>PostgreSQL</option>
				</select>
			</div>
			
			<div class="selector-container"> 
				<label for="sql-normalization-selector" class="select-label">
					<i class="fa-regular fa-file-code"></i> Normalization level:
				</label>
				<select class="select-for-sql" id="sql-normalization-selector">
					<option>FN1</option>
					<option>FN2</option>
					<option>FN3</option>
					<option>FN4</option>
					<option>FN5</option>
				</select>
			</div>
		</div>

		<textarea class="sql-editor" id="sql-editor"></textarea>
	</div>

	<div class="container" id="report-container">
		<div class="report-buttons">
			<button class="button-for-report" id="reporter-run">
				Run
				<i class="fa-solid fa-play"></i>
			</button>
			<button class="button-for-report" id="reporter-download">
				Download
				<i class="fa-solid fa-download"></i>
			</button>
		</div>
		<div class="report-page"></div>
	</div>
</section>

{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="{{ url_for('static', filename='js/codeEditor.js') }}"></script>
{% endblock %}
