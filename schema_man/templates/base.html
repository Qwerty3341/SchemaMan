<!DOCTYPE html>
<html lang="es">

<head>
	<title>{% block title %}{% endblock %}</title>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link
		href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600&family=Press+Start+2P&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/MrDB.svg') }}">

	{% block styles %}{% endblock %}
</head>

<body>
	<header>
		<a class="logo-container" href="{{ url_for('main.normalizator') }}">
			<h1>Schema Man</h1>
		</a>
		<nav class="nav-list">
			<a href="{{ url_for('manual.manual_index') }}">Manual</a>
			<a href="{{ url_for('nf.nf1') }}">NF1</a>
			<a href="{{ url_for('nf.nf2') }}">NF2</a>
			<a href="{{ url_for('nf.nf3') }}">NF3</a>
			<a href="{{ url_for('nf.bcnf') }}">BCNF</a>
			<a href="{{ url_for('nf.nf4') }}">NF4</a>
			<a href="{{ url_for('nf.nf5') }}">NF5</a>
		</nav>
	</header>

	<main class="content">
		{% block content %}{% endblock %}
	</main>

	{% block scripts %}
	{% endblock %}

	<footer>
		<a href="{{ url_for('about.about_index') }}">About</a>
	</footer>
</body>

</html>
